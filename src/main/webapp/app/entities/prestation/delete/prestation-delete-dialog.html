@if (prestation) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(prestation.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="prestationDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-prestation-heading"
        jhiTranslate="conciergerieApp.prestation.delete.question"
        [translateValues]="{ id: prestation.id }"
      >
        Êtes-vous certain de vouloir supprimer le Prestation {{ prestation.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="jhi-confirm-delete-prestation" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
