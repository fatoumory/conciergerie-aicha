@if (eligibiliteService) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(eligibiliteService.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="eligibiliteServiceDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmation de suppression
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-eligibiliteService-heading"
        jhiTranslate="conciergerieApp.eligibiliteService.delete.question"
        [translateValues]="{ id: eligibiliteService.id }"
      >
        Êtes-vous certain de vouloir supprimer le Eligibilite Service {{ eligibiliteService.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="jhi-confirm-delete-eligibiliteService" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
