<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (zone(); as zoneRef) {
      <div>
        <h2 data-cy="zoneDetailsHeading"><span jhiTranslate="conciergerieApp.zone.detail.title">Zone</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="conciergerieApp.zone.id">Id</span></dt>
          <dd>
            <span>{{ zoneRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.zone.code">Code</span></dt>
          <dd>
            <span>{{ zoneRef.code }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.zone.libelle">Libelle</span></dt>
          <dd>
            <span>{{ zoneRef.libelle }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/zone', zoneRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
