<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (evaluation(); as evaluationRef) {
      <div>
        <h2 data-cy="evaluationDetailsHeading"><span jhiTranslate="conciergerieApp.evaluation.detail.title">Evaluation</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="conciergerieApp.evaluation.id">Id</span></dt>
          <dd>
            <span>{{ evaluationRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.evaluation.note">Note</span></dt>
          <dd>
            <span>{{ evaluationRef.note }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.evaluation.commentaire">Commentaire</span></dt>
          <dd>
            <span>{{ evaluationRef.commentaire }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.evaluation.dateEvaluation">Date Evaluation</span></dt>
          <dd>
            <span>{{ evaluationRef.dateEvaluation | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.evaluation.demande">Demande</span></dt>
          <dd>
            @if (evaluation()!.demande) {
              <div>
                <a [routerLink]="['/demande', evaluation()!.demande?.id, 'view']">{{ evaluationRef.demande?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/evaluation', evaluationRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
