@if (transactionPaiement) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(transactionPaiement.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="transactionPaiementDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmation de suppression
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-transactionPaiement-heading"
        jhiTranslate="conciergerieApp.transactionPaiement.delete.question"
        [translateValues]="{ id: transactionPaiement.id }"
      >
        Êtes-vous certain de vouloir supprimer le Transaction Paiement {{ transactionPaiement.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="jhi-confirm-delete-transactionPaiement" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
