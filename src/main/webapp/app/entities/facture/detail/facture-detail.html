<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (facture(); as factureRef) {
      <div>
        <h2 data-cy="factureDetailsHeading"><span jhiTranslate="conciergerieApp.facture.detail.title">Facture</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="conciergerieApp.facture.id">Id</span></dt>
          <dd>
            <span>{{ factureRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.facture.numero">Numero</span></dt>
          <dd>
            <span>{{ factureRef.numero }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.facture.montant">Montant</span></dt>
          <dd>
            <span>{{ factureRef.montant }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.facture.dateGeneration">Date Generation</span></dt>
          <dd>
            <span>{{ factureRef.dateGeneration | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="conciergerieApp.facture.demande">Demande</span></dt>
          <dd>
            @if (facture()!.demande) {
              <div>
                <a [routerLink]="['/demande', facture()!.demande?.id, 'view']">{{ factureRef.demande?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/facture', factureRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
